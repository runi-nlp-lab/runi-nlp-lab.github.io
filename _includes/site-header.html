<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ── Reset / base ─────────────────────────────────────────── */
  * { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    margin: 0; padding: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x: hidden;
  }

  /* Force Plus Jakarta Sans everywhere */
  h1, h2, h3, h4, h5, h6, p, a, li, span, div, nav, button {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif !important;
  }

  /* Strip ALL Alembic containers so full-bleed elements work */
  .main.container,
  .article--page,
  .article,
  .content,
  .typeset {
    max-width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
  }
  .article--page > h1:first-child { display: none; }

  /* ── Global links / buttons ──────────────────────────────── */
  a { color: #0b369e !important; text-decoration: none !important; border-bottom: none !important; box-shadow: none !important; background: transparent !important; background-image: none !important; }
  a:hover { color: #3a5fcc !important; text-decoration: underline !important; background: transparent !important; }
  hr { border: none; border-top: 2px solid #dde5f7; }
  button, .btn, .button, input[type="submit"] { background-color: #0b369e; border-color: #0b369e; color: #fff; border-radius: 6px; }
  button:hover, .btn:hover { background-color: #3a5fcc; }

  /* ── Full-bleed helper (margin-based, scroll-safe) ──────── */
  .runi-fullbleed {
    width: 100%;
    display: block;
  }

  /* ── Navbar ─────────────────────────────────────────────── */
  .runi-nav {
    display: block;
    width: 100%;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
  }
  .runi-nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 48px; min-height: 80px;
    max-width: 1100px; margin: 0 auto;
  }
  .runi-nav-brand {
    display: flex; align-items: center;
    text-decoration: none !important;
  }
  .runi-nav-brand img {
    height: 52px; width: auto; object-fit: contain;
  }
  .nav-divider {
    width: 1px; height: 32px; background: #d1d5db; margin: 0 4px;
  }
  .runi-nav-links {
    display: flex; align-items: center; gap: 32px;
    list-style: none; margin: 0; padding: 0;
  }
  .runi-nav-links li a {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.88em; font-weight: 600;
    color: #374151 !important; text-decoration: none !important;
    padding-bottom: 2px; border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .runi-nav-links li a:hover {
    color: #0b369e !important; text-decoration: none !important;
    border-bottom-color: #0b369e;
  }

  /* ── Hero ─────────────────────────────────────────────────── */
  .runi-hero {
    background: #f8fafc;
    padding: 56px 0 64px;
    border-bottom: 1px solid #e2e8f0;
  }
  .runi-hero-inner {
    max-width: 1100px; margin: 0 auto; padding: 0 48px;
  }

  /* Logo + title block (Insight-style) */
  .runi-hero-brand {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 24px;
  }
  .runi-hero-brand img {
    height: 160px;
    width: auto;
    object-fit: contain;
    flex-shrink: 0;
    align-self: center;
  }
  .runi-hero-brand-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
  }
  .runi-hero-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(2.4em, 5vw, 3.8em);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1.5px;
    color: #0b369e !important;
    margin: 0;
  }
  .runi-hero-subtitle {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(1em, 2vw, 1.3em);
    font-weight: 500;
    color: #64748b !important;
    margin: 0;
    letter-spacing: -0.2px;
  }

  .runi-hero-desc {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.05em; line-height: 1.8;
    color: #374151 !important;
    margin: 0;
  }
  .runi-hero-desc a      { color: #0b369e !important; font-weight: 600; text-decoration: underline !important; }
  .runi-hero-desc strong { color: #1e293b !important; }

  /* Down arrow */
  .runi-hero-arrow { padding-top: 28px; }
  .runi-hero-arrow svg { opacity: 0.3; }

  /* ── Research cards ──────────────────────────────────────── */
  .research-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin: 20px 0 40px;
  }
  .research-card {
    background: #ffffff;
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    border-top: 3px solid #0b369e;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .research-card-title {
    font-size: 1em; font-weight: 700;
    color: #0b369e; margin: 0;
  }
  .research-card-desc {
    font-size: 0.88em; color: #374151;
    line-height: 1.65; margin: 0; flex: 1;
  }
  .research-card-example {
    font-size: 0.82em; color: #64748b;
    line-height: 1.5; margin: 0;
    padding-top: 8px;
    border-top: 1px solid #e2e8f0;
  }
  .research-card-example a { color: #0b369e !important; font-weight: 600; text-decoration: underline !important; }
  .research-card-cite { color: #94a3b8; font-style: italic; }

  @media (max-width: 800px) {
    .research-grid { grid-template-columns: 1fr; }
  }

  /* ── News cards ───────────────────────────────────────────── */
  .news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin: 24px 0 32px;
  }
  .news-card {
    background: #ffffff;
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .news-card-date {
    font-size: 0.8em;
    font-weight: 500;
    color: #94a3b8;
    letter-spacing: 0.3px;
  }
  .news-card-title {
    font-size: 1em;
    font-weight: 700;
    color: #1e293b;
    line-height: 1.35;
    margin: 0;
  }
  .news-card-title a {
    color: #1e293b !important;
    text-decoration: none !important;
  }
  .news-card-title a:hover { color: #0b369e !important; }
  .news-card-desc {
    font-size: 0.88em;
    color: #64748b;
    line-height: 1.6;
    margin: 0;
    flex: 1;
  }
  .news-see-all {
    text-align: center;
    margin-top: 8px;
  }
  .news-see-all a {
    display: inline-block;
    padding: 10px 28px;
    background: #0b369e !important;
    color: #ffffff !important;
    border-radius: 6px;
    font-size: 0.9em;
    font-weight: 600;
    text-decoration: none !important;
    transition: background 0.15s;
  }
  .news-see-all a:hover { background: #3a5fcc !important; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }

  @media (max-width: 800px) {
    .news-grid { grid-template-columns: 1fr; }
  }

  /* ── Contact section ─────────────────────────────────────── */
  .contact-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #ffffff;
    border-radius: 10px;
    padding: 28px 32px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    margin: 20px 0 40px;
  }
  .contact-lab {
    font-size: 1.05em; font-weight: 700;
    color: #1e293b; margin: 0 0 4px;
  }
  .contact-address {
    font-size: 0.9em; color: #64748b; margin: 0;
  }
  .contact-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 22px;
    background: #0b369e !important;
    color: #ffffff !important;
    border-radius: 6px;
    font-size: 0.9em; font-weight: 600;
    text-decoration: none !important;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .contact-btn:hover { background: #3a5fcc !important; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; }
  @media (max-width: 600px) {
    .contact-card { flex-direction: column; align-items: flex-start; gap: 16px; }
  }

  /* ── Team page ───────────────────────────────────────────── */
  .director-card {
    display: grid !important;
    grid-template-columns: 130px 1fr !important;
    gap: 32px !important;
    align-items: start !important;
    background: #ffffff !important;
    border-radius: 10px !important;
    padding: 28px 28px 40px 28px !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07) !important;
    margin: 20px 0 40px !important;
    overflow: visible !important;
  }
  .director-card img {
    width: 130px; height: 130px; border-radius: 50%;
    object-fit: cover;
  }
  .director-info { min-width: 0; }
  .director-name {
    font-size: 1.2em; font-weight: 700; color: #1e293b; margin: 0 0 2px;
  }
  .director-role {
    font-size: 0.85em; font-weight: 600; color: #0b369e; margin: 0 0 12px;
  }
  .director-bio {
    font-size: 0.85em; line-height: 1.7; color: #64748b; margin: 0 0 14px;
  }
  .director-links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
  .director-links a {
    font-size: 0.82em; font-weight: 600; padding: 4px 12px;
    border: 1.5px solid #0b369e; border-radius: 4px;
    color: #0b369e !important; text-decoration: none !important;
    transition: background 0.15s;
  }
  .director-links a:hover {
    background: #0b369e !important;
    color: #ffffff !important;
    -webkit-text-fill-color: #ffffff !important;
    text-shadow: none !important;
  }

  .members-grid-new {
    display: grid !important;
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 16px !important;
    margin: 20px 0 40px !important;
  }
  .member-card-new {
    background: #ffffff !important;
    border-radius: 10px !important;
    padding: 24px 16px !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07) !important;
    text-align: center !important;
    overflow: visible !important;
  }
  .member-card-new img {
    width: 80px !important; height: 80px !important;
    border-radius: 50% !important;
    object-fit: cover !important;
    margin: 0 auto 12px !important;
    display: block !important;
    aspect-ratio: 1/1 !important;
  }
  .member-card-new h4 {
    font-size: 0.9em !important; font-weight: 700 !important;
    color: #1e293b !important; margin: 0 !important;
    line-height: 1.3 !important;
  }
  .member-card-new h4 a { color: #1e293b !important; text-decoration: none !important; }
  .member-card-new h4 a:hover { color: #0b369e !important; }

  ul.former-list,
  .typeset ul.former-list,
  .content ul.former-list {
    display: flex !important; flex-wrap: wrap !important; gap: 10px !important;
    margin: 16px 0 40px !important; list-style: none !important;
    padding: 0 !important; margin-left: 0 !important;
  }
  ul.former-list li,
  .typeset ul.former-list li {
    padding: 0 !important; margin: 0 !important;
    list-style: none !important;
  }
  .former-list li a {
    display: inline-block; padding: 5px 14px;
    background: #ffffff; border-radius: 20px;
    font-size: 0.85em; color: #374151 !important;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    text-decoration: none !important;
    transition: color 0.15s;
  }
  .former-list li a:hover { color: #0b369e !important; }

  @media (max-width: 800px) {
    .director-card { grid-template-columns: 1fr; }
    .director-card img { width: 100px; height: 100px; }
    .members-grid-new { grid-template-columns: repeat(2, 1fr); }
  }

  /* ── Footer override ─────────────────────────────────────── */
  .footer {
    background: #f8fafc !important;
    border-top: 1px solid #e2e8f0 !important;
    color: #94a3b8 !important;
  }
  .footer small, .footer a, .footer p {
    color: #94a3b8 !important;
    font-size: 0.82em !important;
  }
  .footer a:hover { color: #0b369e !important; }

  /* ── Page body ─────────────────────────────────────────────── */
  .runi-page-body { max-width: 1100px; margin: 0 auto; padding: 48px 48px 64px; }
  .runi-section-title,
  h2.runi-section-title {
    font-size: 1.3em !important; font-weight: 700 !important;
    color: #0b369e !important; margin: 0 0 4px !important;
    letter-spacing: -0.3px !important;
  }

  /* ── Responsive ────────────────────────────────────────────── */
  @media (max-width: 800px) {
    .runi-nav-inner   { padding: 0 20px; }
    .runi-nav-links   { gap: 18px; }
    .runi-hero        { padding: 36px 0 48px; }
    .runi-hero-inner  { padding: 0 20px; }
    .runi-hero-brand  { gap: 18px; }
    .runi-hero-brand img { height: 64px; }
    .runi-page-body   { padding: 32px 20px 48px; }
  }
</style>

<nav class="runi-nav">
  <div class="runi-nav-inner">
    <a href="/" class="runi-nav-brand">
      <img src="/assets/logo.png" alt="RUNI NLP Lab">
      <div class="nav-divider"></div>
      <img src="/assets/reichman_logo.png" alt="Reichman University">
    </a>
    <ul class="runi-nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/team/">Team</a></li>
      <li><a href="/publications/">Publications</a></li>
      <li><a href="/contact/">Contact</a></li>
    </ul>
  </div>
</nav>
